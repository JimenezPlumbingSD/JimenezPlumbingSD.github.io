<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Jimenez Plumbing Solutions — Full Service Plumbing from Concept to Completion. North County San Diego.">
<title>JPS | Jimenez Plumbing Solutions</title>
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: #05070f;
  overflow: hidden;
  font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
}

/* ── STAGE ── */
.splash-stage {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  background: #05070f;
  cursor: pointer;
  z-index: 1;
}

/* ── PLUMBER IMAGE ── */
.plumber-wrap {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1;
}
.plumber-img {
  max-width: 72vmin;
  max-height: 72vmin;
  width: auto;
  height: auto;
  object-fit: contain;
  opacity: 0;
  transform: scale(0.92);
  animation: plumberEnter 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
}
@keyframes plumberEnter {
  to { opacity: 1; transform: scale(1); }
}

/* ── EYE BLINK OVERLAY ── */
.eye-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 18vmin; height: 12vmin;
  pointer-events: none;
  z-index: 2;
}
.eyelid {
  position: absolute;
  left: 0; right: 0;
  height: 50%;
  background: #05070f;
  transition: transform 0.18s ease;
}
.eyelid.upper { top: 0; transform-origin: top; transform: scaleY(0); }
.eyelid.lower { bottom: 0; transform-origin: bottom; transform: scaleY(0); }
.eye-overlay.blink .eyelid.upper { transform: scaleY(1); }
.eye-overlay.blink .eyelid.lower { transform: scaleY(1); }

/* ── EYE GLOW ── */
.eye-glow {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 22vmin; height: 16vmin;
  background: radial-gradient(ellipse at center, rgba(100,180,255,0.15) 0%, transparent 70%);
  pointer-events: none;
  z-index: 1;
  animation: eyePulse 3s ease-in-out infinite;
}
@keyframes eyePulse {
  0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
  50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.15); }
}

/* ── TEXT CONTENT ── */
.splash-content {
  position: relative;
  z-index: 3;
  text-align: center;
  color: #fff;
  padding: 2rem 1rem 3rem;
  pointer-events: none;
  opacity: 0;
  animation: contentEnter 0.8s ease 1s forwards;
}
@keyframes contentEnter {
  to { opacity: 1; }
}
.brand {
  font-size: 0.75rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.7;
  margin-bottom: 0.5rem;
}
.tag {
  font-size: clamp(1rem, 3.5vw, 1.4rem);
  font-weight: 700;
  margin-bottom: 0.25rem;
}
.sub {
  font-size: 0.7rem;
  opacity: 0.55;
  letter-spacing: 1px;
}
.hint {
  margin-top: 1.2rem;
  font-size: 0.65rem;
  opacity: 0.45;
  letter-spacing: 1px;
}
.version {
  font-size: 0.55rem;
  opacity: 0.35;
  margin-top: 0.4rem;
}

/* ── WATER PARTICLES ── */
.particle {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  z-index: 4;
}
.particle.drop {
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(120,200,255,0.7));
  box-shadow: 0 0 6px rgba(100,180,255,0.5);
}
.particle.mist {
  background: rgba(160,210,255,0.4);
  filter: blur(2px);
}
.particle.splash {
  background: rgba(200,230,255,0.6);
}

/* ── SHOCKWAVE ── */
.shockwave {
  position: absolute;
  border: 2px solid rgba(160,210,255,0.6);
  border-radius: 50%;
  pointer-events: none;
  z-index: 3;
  box-shadow: 0 0 12px rgba(100,180,255,0.3);
}

/* ── SCREEN FLASH ── */
.screen-flash {
  position: fixed;
  inset: 0;
  background: rgba(160,210,255,0.2);
  pointer-events: none;
  z-index: 10;
  opacity: 0;
}
.screen-flash.active {
  animation: flashAnim 0.3s ease-out;
}
@keyframes flashAnim {
  0% { opacity: 1; }
  100% { opacity: 0; }
}

/* ── EXIT TRANSITION ── */
.splash-stage.exiting {
  animation: stageExit 0.6s ease forwards;
}
@keyframes stageExit {
  to { opacity: 0; transform: scale(1.05); }
}

/* ── LOADING SCREEN ── */
.loading-screen {
  position: fixed; inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #05070f;
  z-index: 100;
  transition: opacity 0.8s ease;
}
.loading-screen.done {
  opacity: 0;
  pointer-events: none;
}
.loading-spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(255,255,255,0.1);
  border-top-color: #0072C6;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  font-size: 0.75rem;
  opacity: 0.6;
  letter-spacing: 2px;
  text-transform: uppercase;
}
</style>
</head>
<body>

<!-- Loading screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading JPS</div>
</div>

<!-- Screen flash overlay -->
<div class="screen-flash" id="screenFlash"></div>

<!-- Main stage -->
<div class="splash-stage" id="splashStage" tabindex="0" aria-label="JPS splash page. Click to enter.">

  <!-- Eye glow behind image -->
  <div class="eye-glow" id="eyeGlow"></div>

  <!-- Plumber image -->
  <div class="plumber-wrap">
    <img
      src="static/images/jps_all_seeing_plumber.png"
      alt="JPS All-Seeing Plumber logo"
      class="plumber-img"
      id="plumberImg"
      loading="eager"
    >
  </div>

  <!-- Eye blink overlay -->
  <div class="eye-overlay" id="eyeOverlay">
    <div class="eyelid upper"></div>
    <div class="eyelid lower"></div>
  </div>

  <!-- Particle container -->
  <div id="particleContainer" style="position:absolute;inset:0;pointer-events:none;z-index:4;"></div>

  <!-- Text content -->
  <div class="splash-content">
    <div class="brand">Jimenez Plumbing Solutions Inc.</div>
    <div class="tag">Full Service Plumbing<br>from Concept to Completion</div>
    <div class="sub">North County San Diego • Est. 1989 • CA C-36 #568271</div>
    <div class="hint">CLICK THE EYE — WATER EXPLOSION</div>
    <div class="version">Built with pride in Ramona • Powered by Botwave AI • JPS v2</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  const stage = document.getElementById('splashStage');
  const img = document.getElementById('plumberImg');
  const eyeOverlay = document.getElementById('eyeOverlay');
  const particleContainer = document.getElementById('particleContainer');
  const screenFlash = document.getElementById('screenFlash');
  const loadingScreen = document.getElementById('loadingScreen');

  let isExploding = false;

  // ── Dismiss loading screen once image is ready ──
  function dismissLoading() {
    loadingScreen.classList.add('done');
    setTimeout(() => loadingScreen.remove(), 800);
  }

  if (img.complete && img.naturalWidth > 0) {
    dismissLoading();
  } else {
    img.addEventListener('load', dismissLoading, { once: true });
    img.addEventListener('error', () => {
      // If image fails, show stage anyway with text-only fallback
      img.style.display = 'none';
      dismissLoading();
    }, { once: true });
    // Hard cap: dismiss after 3s regardless
    setTimeout(dismissLoading, 3000);
  }

  // ── AUTO-BLINK ──
  function blink() {
    if (isExploding) return;
    eyeOverlay.classList.add('blink');
    setTimeout(() => eyeOverlay.classList.remove('blink'), 280);
  }
  setInterval(blink, 5200);

  // ── WATER EXPLOSION ──
  function createDrop(x, y, isMain) {
    const el = document.createElement('div');
    el.className = 'particle ' + (isMain ? 'drop' : 'mist');

    const angle = Math.random() * Math.PI * 2;
    const speed = isMain ? (4 + Math.random() * 10) : (1.5 + Math.random() * 4);
    const vx = Math.cos(angle) * speed;
    const vy = Math.sin(angle) * speed - (isMain ? 3 : 1);
    const size = isMain ? (3 + Math.random() * 5) : (1.5 + Math.random() * 2.5);
    const life = isMain ? (700 + Math.random() * 500) : (350 + Math.random() * 300);

    el.style.cssText = `
      left:${x}px; top:${y}px;
      width:${size}px; height:${size}px;
      transition: transform ${life}ms ease-out, opacity ${life}ms ease-out;
    `;
    particleContainer.appendChild(el);

    // Force reflow
    void el.offsetWidth;

    const endX = x + vx * (life / 16);
    const endY = y + vy * (life / 16) + 0.5 * 0.15 * Math.pow(life / 16, 2); // gravity

    el.style.transform = `translate(${endX - x}px, ${endY - y}px) scale(${isMain ? 0.3 : 0})`;
    el.style.opacity = '0';

    setTimeout(() => el.remove(), life + 50);
  }

  function createShockwave(x, y, delay) {
    const el = document.createElement('div');
    el.className = 'shockwave';
    const size = 20 + delay * 15;
    el.style.cssText = `
      left:${x - size/2}px; top:${y - size/2}px;
      width:${size}px; height:${size}px;
      opacity:0.8;
      transition: all ${600 + delay * 150}ms ease-out;
    `;
    particleContainer.appendChild(el);

    void el.offsetWidth;

    el.style.transform = `scale(${4 + delay})`;
    el.style.opacity = '0';

    setTimeout(() => el.remove(), 900 + delay * 150);
  }

  function createGeyser(x, y) {
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'particle drop';
      const vx = (Math.random() - 0.5) * 3;
      const vy = -(6 + Math.random() * 8);
      const size = 3 + Math.random() * 3;
      const life = 400 + Math.random() * 300;

      el.style.cssText = `left:${x}px; top:${y}px; width:${size}px; height:${size}px; transition: transform ${life}ms ease-out, opacity ${life}ms ease-out;`;
      particleContainer.appendChild(el);
      void el.offsetWidth;

      el.style.transform = `translate(${vx * 30}px, ${vy * 25}px) scale(0.2)`;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), life + 50);
    }
  }

  function createSplashDroplets(x, y) {
    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      el.className = 'particle splash';
      const angle = Math.random() * Math.PI * 2;
      const dist = 20 + Math.random() * 40;
      const size = 2 + Math.random() * 3;
      el.style.cssText = `left:${x}px; top:${y}px; width:${size}px; height:${size}px; transition: all 400ms ease-out;`;
      particleContainer.appendChild(el);
      void el.offsetWidth;
      el.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist - 10}px) scale(0)`;
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 450);
    }
  }

  function explode(clickX, clickY) {
    if (isExploding) return;
    isExploding = true;

    // Get click position or default to center
    const rect = stage.getBoundingClientRect();
    const cx = clickX || rect.width / 2;
    const cy = clickY || rect.height * 0.42; // approximate eye height

    // Blink shut
    eyeOverlay.classList.add('blink');

    // Screen flash
    screenFlash.classList.add('active');
    setTimeout(() => screenFlash.classList.remove('active'), 300);

    // Spawn drops
    for (let i = 0; i < 80; i++) createDrop(cx, cy, true);
    for (let i = 0; i < 60; i++) createDrop(cx, cy, false);

    // Geyser burst
    createGeyser(cx, cy);

    // Shockwaves
    for (let i = 0; i < 3; i++) createShockwave(cx, cy, i);

    // Splash droplets after impact
    setTimeout(() => createSplashDroplets(cx, cy + 60), 200);

    // Open eyelid
    setTimeout(() => eyeOverlay.classList.remove('blink'), 400);

    // Exit to homepage
    setTimeout(() => {
      stage.classList.add('exiting');
      setTimeout(() => {
        window.location.href = 'home.html';
      }, 600);
    }, 900);
  }

  // ── EVENTS ──
  stage.addEventListener('click', (e) => {
    explode(e.clientX, e.clientY);
  });

  stage.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      explode();
    }
  });

  // Touch support
  stage.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      const t = e.touches[0];
      explode(t.clientX, t.clientY);
    }
  }, { passive: true });

  // Parallax on mouse move (subtle)
  let mouseTimeout;
  stage.addEventListener('mousemove', (e) => {
    if (isExploding) return;
    const rect = stage.getBoundingClientRect();
    const dx = (e.clientX - rect.width / 2) / rect.width;
    const dy = (e.clientY - rect.height / 2) / rect.height;
    img.style.transform = `scale(1) translate(${dx * -8}px, ${dy * -8}px)`;
    clearTimeout(mouseTimeout);
    mouseTimeout = setTimeout(() => {
      img.style.transform = 'scale(1) translate(0,0)';
    }, 100);
  });

})();
</script>

</body>
</html>
